services:
  discovery:
    build:
      context: .
      args: { MODULE: discovery }
    ports: ["8761:8761"]
  hotel:
    build:
      context: .
      args: { MODULE: hotel }
    environment:
      EUREKA_URL: http://discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-at-least-32-bytes-long}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-at-least-32-bytes-long}
    depends_on: [discovery]
  booking:
    build:
      context: .
      args: { MODULE: booking }
    environment:
      EUREKA_URL: http://discovery:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-at-least-32-bytes-long}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-at-least-32-bytes-long}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin12345!}
    depends_on: [discovery, hotel]
  gateway:
    build:
      context: .
      args: { MODULE: gateway }
    environment:
      EUREKA_URL: http://discovery:8761/eureka/
    ports: ["8080:8080"]
    depends_on: [discovery, hotel, booking]
