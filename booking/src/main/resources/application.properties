server.port=8082
spring.application.name=booking
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
spring.datasource.url=jdbc:h2:mem:booking;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
security.jwt.secret=${JWT_SECRET:local-development-secret-at-least-32-bytes-long}
security.internal.secret=${INTERNAL_SECRET:local-internal-secret-at-least-32-bytes-long}
logging.pattern.level=%5p [traceId=%X{traceId}]
hotel.url=http://hotel
eureka.instance.prefer-ip-address=true
